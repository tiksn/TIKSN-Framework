name: CICD

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - name: "Install .NET Core SDK"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      - name: Install .NET MAUI
        run: dotnet workload install maui
      - name: "Cache PowerShell Modules"
        if: github.event_name != 'release'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: ~/Documents/PowerShell/Modules
          key: ${{ runner.os }}-psmodules-${{ hashFiles('.build.ps1', '.github/workflows/cicd.yml') }}
          restore-keys: |
            ${{ runner.os }}-psmodules-
      - name: "Install InvokeBuild Module"
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name InvokeBuild)) {
            Install-Module -Name InvokeBuild -Force -Scope CurrentUser
          }
      - name: "Restore"
        shell: pwsh
        run: .\restore.ps1 -Instance ${{github.run_id}}
      - name: "Format"
        shell: pwsh
        run: .\format.ps1 -Instance ${{github.run_id}}
      - name: "Version"
        shell: pwsh
        run: .\version.ps1 -Instance ${{github.run_id}}
      - name: "Build"
        shell: pwsh
        run: .\build.ps1 -Instance ${{github.run_id}}
      - name: "Publish Artefacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifact
          path: ".trash"
          include-hidden-files: true

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: "Install .NET Core SDK"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      - name: "Cache PowerShell Modules"
        if: github.event_name != 'release'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: ~/.local/share/powershell/Modules
          key: ${{ runner.os }}-psmodules-${{ hashFiles('.build.ps1', '.github/workflows/cicd.yml') }}
          restore-keys: |
            ${{ runner.os }}-psmodules-
      - name: "Install InvokeBuild Module"
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name InvokeBuild)) {
            Install-Module -Name InvokeBuild -Force -Scope CurrentUser
          }
      - name: "Download Build Artefacts"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifact
          path: ".trash"
      - name: "Test"
        shell: pwsh
        run: .\test.ps1 -Instance ${{github.run_id}}
      - name: "Publish Test Artefacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-artifact
          path: ".trash"
          include-hidden-files: true

  pack:
    name: Pack
    needs: test
    runs-on: windows-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: "Cache PowerShell Modules"
        if: github.event_name != 'release'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: ~/Documents/PowerShell/Modules
          key: ${{ runner.os }}-psmodules-${{ hashFiles('.build.ps1', '.github/workflows/cicd.yml') }}
          restore-keys: |
            ${{ runner.os }}-psmodules-
      - name: "Install InvokeBuild Module"
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name InvokeBuild)) {
            Install-Module -Name InvokeBuild -Force -Scope CurrentUser
          }
      - name: "Download Test Artefacts"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-artifact
          path: ".trash"
      - name: "Pack"
        shell: pwsh
        run: .\pack.ps1 -Instance ${{github.run_id}}
      - name: "Publish Artefacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pack-artifact
          path: ".trash"
          include-hidden-files: true

  publish:
    name: Publish
    needs: pack
    if: github.event_name == 'release'
    environment:
      name: "NuGet"
      url: https://www.nuget.org/packages/TIKSN-Framework/
    runs-on: windows-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - name: "Download Artefact"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pack-artifact
          path: ".trash"
      - name: "Install InvokeBuild Module"
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name InvokeBuild)) {
            Install-Module -Name InvokeBuild -Force -Scope CurrentUser
          }
      - name: "Publish"
        env:
          NUGET_API_KEY: ${{secrets.NUGET_API_KEY}}
        shell: pwsh
        run: .\publish.ps1 -Instance ${{github.run_id}}
